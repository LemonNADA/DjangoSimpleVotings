<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>

    <!-- Подключение Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        .profile-card {
            max-width: 500px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-vk {
            background-color: #0077FF;
            color: white;
        }

        .btn-vk:hover {
            background-color: #005FCC;
            color: white;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .password-wrapper i {
            position: absolute;
            right: 10px;
            top: 70%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            color: #6c757d;
        }

        .password-wrapper i:hover {
            color: #000;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="profile-card">
            <h2 class="fw-bold text-center">{{page_title}}</h2>
            <form method="post">
                {% csrf_token %}
                <hr>
                <div class="mb-3">
                    <label class="form-label"><strong>Имя:</strong></label>
                    <input type="text" name="name" class="form-control" value={{ user_name }}>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Email:</strong></label>
                    <input type="email" name="email" class="form-control" value={{ user_email }}>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Город:</strong></label>
                    <input type="text" name="city" class="form-control" value={{ user_city }}>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Логин:</strong></label>
                    <input type="text" name="login" class="form-control" value={{ user_login }} oninput="lockFirstCharacter(this)">

                    <script>
                    function lockFirstCharacter(input) {
                        if (!input.value.startsWith('@')) {
                            input.value = '@' + input.value.replace(/@/g, '');
                        }
                    }
                    </script>
                </div>

                <div class="mb-3 password-wrapper">
                    <label class="form-label"><strong>Пароль:</strong></label>
                    <input type="password" id="password" name="password" class="form-control" value="ivanivanov2001" maxlength="35">
                    <i class="bi bi-eye" id="togglePassword"></i>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>О себе:</strong></label>
                    <textarea name="bio" class="form-control" rows="4">{{ user_about_oneself }}</textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-vk">Сохранить</button>
                    <a href="{% url 'Profile' %}" class="btn btn-outline-secondary">Назад</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordField = document.getElementById('password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                this.classList.remove('bi-eye-slash');
                this.classList.add('bi-eye');
            } else {
                passwordField.type = 'password';
                this.classList.remove('bi-eye');
                this.classList.add('bi-eye-slash');
            }
        });
    </script>
</body>
</html>
